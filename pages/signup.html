<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — District Coffee Co.</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="signup">

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="navbar-root"></div>

  <main id="main-content">
    <section class="section">
      <div class="container-custom" style="max-width: 420px;">
        <p class="eyebrow mb-2">Join us</p>
        <h1 class="font-display mb-4">Create an account</h1>

        <form id="signup-form" novalidate>
          <div class="mb-3">
            <label for="signup-name" class="form-label">Full name</label>
            <input type="text" class="form-control" id="signup-name" required>
          </div>
          <div class="mb-3">
            <label for="signup-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="signup-email" required>
          </div>
          <div class="mb-4">
            <label for="signup-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="signup-password" required>
            <div class="form-text">At least 6 characters.</div>
          </div>
          <button type="submit" class="btn btn-brand w-100">Sign up</button>
        </form>

        <p class="mt-4 text-center" style="font-size: var(--fs-sm);">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/data/products.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/utils/validators.js"></script>
  <script src="../assets/js/utils/auth.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/components/cart.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', handleSignupSubmit);
  </script>
</body>
</html>
