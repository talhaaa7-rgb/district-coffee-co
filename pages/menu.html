<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — District Coffee Co.</title>
  <meta name="description" content="Coffee and desserts at District Coffee Co.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">

  <style>
    .menu-filter-btn {
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: var(--space-2) var(--space-6);
      border-radius: 999px;
      border: 2px solid var(--color-border);
      background: #fff;
      color: var(--color-ink);
      margin-right: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .menu-filter-btn.active {
      background: var(--color-rust);
      border-color: var(--color-rust);
      color: #fff;
    }
  </style>
</head>
<body data-page="menu">

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="navbar-root"></div>

  <main id="main-content">
    <section class="section pb-3">
      <div class="container-custom">
        <p class="eyebrow mb-2">Full menu</p>
        <h1 class="font-display mb-4">Coffee &amp; Desserts</h1>

        <div class="mb-5" role="group" aria-label="Filter menu by category">
          <button class="menu-filter-btn active" data-category="all">All</button>
          <button class="menu-filter-btn" data-category="coffee">Coffee</button>
          <button class="menu-filter-btn" data-category="dessert">Desserts</button>
        </div>

        <div class="row g-4" id="menu-grid"></div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/data/products.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/components/cart.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/product-card.js"></script>
  <script src="../assets/js/components/menu.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderMenuGrid('all');
      initMenuFilters();
    });
  </script>
</body>
</html>
