<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — District Coffee Co.</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="admin">

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="navbar-root"></div>

  <main id="main-content">
    <section class="section">
      <div class="container-custom">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-5">
          <div>
            <p class="eyebrow mb-2">Staff only</p>
            <h1 class="font-display mb-0">Admin Dashboard</h1>
          </div>
          <button class="btn btn-brand-outline" style="border-color: var(--color-rust); color: var(--color-rust);" onclick="adminLogout()">Log out</button>
        </div>

        <div class="row g-3 mb-5" id="admin-stats"></div>

        <h2 class="fs-4 mb-3">Recent orders</h2>
        <div id="admin-orders" class="mb-5"></div>

        <h2 class="fs-4 mb-3">Menu catalog</h2>
        <div id="admin-products"></div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/data/products.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/components/cart.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/product-card.js"></script>
  <script src="../assets/js/utils/auth.js"></script>
  <script src="../assets/js/components/admin.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!initAdminGuard()) return;
      renderAdminStats();
      renderAdminOrdersTable();
      renderAdminProductsTable();
    });
  </script>
</body>
</html>
