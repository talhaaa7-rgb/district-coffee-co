<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — District Coffee Co.</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="login">

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="navbar-root"></div>

  <main id="main-content">
    <section class="section">
      <div class="container-custom" style="max-width: 420px;">
        <p class="eyebrow mb-2">Welcome back</p>
        <h1 class="font-display mb-4">Log in</h1>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="login-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="login-email" required>
          </div>
          <div class="mb-4">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="login-password" required>
          </div>
          <button type="submit" class="btn btn-brand w-100">Log in</button>
        </form>

        <p class="mt-4 text-center" style="font-size: var(--fs-sm);">
          No account yet? <a href="signup.html">Sign up</a>
        </p>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/data/products.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/utils/validators.js"></script>
  <script src="../assets/js/utils/auth.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/components/cart.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
  </script>
</body>
</html>
