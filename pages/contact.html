<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — District Coffee Co.</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="contact">

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="navbar-root"></div>

  <main id="main-content">
    <section class="section">
      <div class="container-custom">
        <p class="eyebrow mb-2">Get in touch</p>
        <h1 class="font-display mb-5">Contact us</h1>

        <div class="row">
          <div class="col-lg-6">
            <form id="contact-form" novalidate>
              <div class="mb-3">
                <label for="contact-name" class="form-label">Name</label>
                <input type="text" class="form-control" id="contact-name" required>
              </div>
              <div class="mb-3">
                <label for="contact-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="contact-email" required>
              </div>
              <div class="mb-4">
                <label for="contact-message" class="form-label">Message</label>
                <textarea class="form-control" id="contact-message" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-brand">Send message</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/data/products.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/utils/validators.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/components/cart.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/contact.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('contact-form').addEventListener('submit', handleContactSubmit);
    });
  </script>
</body>
</html>
