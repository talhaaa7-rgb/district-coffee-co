<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — District Coffee Co.</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="cart">

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="navbar-root"></div>

  <main id="main-content">
    <section class="section">
      <div class="container-custom">
        <h1 class="font-display mb-5">Checkout</h1>
        <div class="row g-5">
          <div class="col-lg-7">
            <form id="checkout-form" novalidate>
              <div class="mb-3">
                <label for="checkout-name" class="form-label">Full name</label>
                <input type="text" class="form-control" id="checkout-name" required>
              </div>
              <div class="mb-3">
                <label for="checkout-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="checkout-email" required>
              </div>
              <div class="mb-4">
                <label for="checkout-address" class="form-label">Pickup or delivery address</label>
                <textarea class="form-control" id="checkout-address" rows="3" required></textarea>
              </div>
              <button type="submit" class="btn btn-brand w-100" id="place-order-btn">Place order</button>
            </form>
          </div>
          <div class="col-lg-5">
            <div class="p-4" style="background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md);">
              <p class="eyebrow mb-3">Order summary</p>
              <div id="order-summary"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/data/products.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/utils/validators.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/components/cart.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/product-card.js"></script>
  <script src="../assets/js/components/checkout.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderOrderSummary();
      document.getElementById('checkout-form').addEventListener('submit', handleCheckoutSubmit);
    });
  </script>
</body>
</html>
